<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOB CRM</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg: #f4f4f5;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #71717a;
    --accent: #27272a;
    --accent-hover: #3f3f46;
    --error: #b91c1c;
    --error-bg: #fef2f2;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: "SF Mono", "Roboto Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ width: 100%; max-width: 360px; padding: 24px; }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 28px;
    justify-content:center;
  }
  .brand-mark{
    width: 22px; height: 22px;
    border-radius: 4px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .brand-name{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }

  .card h1{
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .card p.sub{
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 22px;
  }

  label{
    display:block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field{ margin-bottom: 16px; }
  .field:last-of-type{ margin-bottom: 0; }

  input{
    width: 100%;
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color .12s ease;
  }
  input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(39,39,42,0.08);
  }
  input::placeholder{ color: #a1a1aa; }

  .err{
    display:none;
    font-size: 12.5px;
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid #fecaca;
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 16px;
  }

  button{
    width: 100%;
    margin-top: 20px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background .12s ease;
  }
  button:hover:not(:disabled){ background: var(--accent-hover); }
  button:disabled{ opacity: .6; cursor: default; }

  .foot{
    text-align:center;
    margin-top: 20px;
    font-size: 11.5px;
    color: #a1a1aa;
  }

  /* dashboard placeholder */
  #app{ display:none; width:100%; min-height:100vh; }
  #app.active{ display:block; }
  #login-view.hidden{ display:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand{ margin:0; justify-content:flex-start; }
  .who{
    font-size: 13px;
    color: var(--text-muted);
    display:flex; align-items:center; gap:12px;
  }
  .who button{
    width:auto; margin:0;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .who button:hover{ background: var(--bg); color: var(--text); }

  .content{
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .content h2{ color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .content p{ font-size: 13.5px; }
</style>
</head>
<body>

  <div class="wrap" id="login-view">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-name">MOB CRM</div>
    </div>
    <div class="card">
      <h1>Entrar</h1>
      <p class="sub">Acesso restrito à equipe MOB Imóveis.</p>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('senha').focus()">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
      </div>

      <div class="err" id="err">E-mail ou senha incorretos.</div>

      <button id="btn-login" onclick="fazerLogin()">Entrar</button>
    </div>
    <div class="foot">crm.imoveismob.com.br</div>
  </div>

  <div id="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-name">MOB CRM</div>
      </div>
      <div class="who">
        <span id="who-name"></span>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="content">
      <h2>Bem-vindo(a)</h2>
      <p>O painel de imóveis ainda está em construção. Login funcionando normalmente.</p>
    </div>
  </div>

<script>
async function neonQuery(sql, params) {
  const res = await fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: sql, params: params || [] })
  });
  if(!res.ok) {
    const err = await res.text();
    throw new Error('Query error: ' + err);
  }
  const data = await res.json();
  return data.rows || [];
}

function getAdminLogado() {
  try {
    var raw = localStorage.getItem('mobcrm_admin');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function showApp(admin) {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  document.getElementById('who-name').textContent = admin.nome + ' · ' + admin.role;
}

async function fazerLogin() {
  var email = document.getElementById('email').value.trim();
  var senha = document.getElementById('senha').value;
  var errEl = document.getElementById('err');
  var btn = document.getElementById('btn-login');

  errEl.style.display = 'none';

  if(!email || !senha) {
    errEl.textContent = 'Preencha e-mail e senha.';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = 'Entrando...';
  btn.disabled = true;

  try {
    var rows = await neonQuery(
      'SELECT id, nome, email, role FROM admins WHERE email=$1 AND senha=$2 LIMIT 1',
      [email, senha]
    );
    btn.textContent = 'Entrar';
    btn.disabled = false;

    if(!rows || rows.length === 0) {
      errEl.textContent = 'E-mail ou senha incorretos.';
      errEl.style.display = 'block';
      return;
    }

    var admin = rows[0];
    localStorage.setItem('mobcrm_admin', JSON.stringify(admin));
    showApp(admin);
  } catch(e) {
    btn.textContent = 'Entrar';
    btn.disabled = false;
    errEl.textContent = 'Não foi possível conectar. Tente novamente.';
    errEl.style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('mobcrm_admin');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('email').value = '';
  document.getElementById('senha').value = '';
}

(function init(){
  var admin = getAdminLogado();
  if(admin) showApp(admin);
})();
</script>

</body>
</html>
