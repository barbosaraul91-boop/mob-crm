<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOB CRM</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg: #f4f4f5;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #18181b;
    --text-muted: #71717a;
    --accent: #27272a;
    --accent-hover: #3f3f46;
    --error: #b91c1c;
    --error-bg: #fef2f2;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: "SF Mono", "Roboto Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  #login-view{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #login-view.hidden{ display:none; }

  .wrap{ width: 100%; max-width: 360px; padding: 24px; }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 28px;
    justify-content:center;
  }
  .brand-mark{
    width: 22px; height: 22px;
    border-radius: 4px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .brand-name{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }

  .card h1{
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .card p.sub{
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 22px;
  }

  label{
    display:block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field{ margin-bottom: 16px; }
  .field:last-of-type{ margin-bottom: 0; }

  input{
    width: 100%;
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color .12s ease;
  }
  input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(39,39,42,0.08);
  }
  input::placeholder{ color: #a1a1aa; }

  .err{
    display:none;
    font-size: 12.5px;
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid #fecaca;
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 16px;
  }

  button{
    width: 100%;
    margin-top: 20px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background .12s ease;
  }
  button:hover:not(:disabled){ background: var(--accent-hover); }
  button:disabled{ opacity: .6; cursor: default; }

  .foot{
    text-align:center;
    margin-top: 20px;
    font-size: 11.5px;
    color: #a1a1aa;
  }

  /* app shell */
  #app{ display:none; width:100%; min-height:100vh; }
  #app.active{ display:block; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand{ margin:0; justify-content:flex-start; }
  .who{
    font-size: 13px;
    color: var(--text-muted);
    display:flex; align-items:center; gap:12px;
  }
  .who button{
    width:auto; margin:0;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .who button:hover{ background: var(--bg); color: var(--text); }

  .content{
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .page{ display:none; }
  .page.active{ display:block; }

  /* ── LISTA ── */
  .lista-head{
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .lista-head h2{ font-size: 16px; margin:0; }
  .lista-count{ font-size: 12.5px; color: var(--text-muted); }

  .filtros{ display:flex; gap:8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filtros input, .filtros select{
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background:#fff;
    color: var(--text);
    outline:none;
  }
  .filtros input{ flex: 1; min-width: 180px; }
  .filtros select{ min-width: 140px; }
  .filtros input:focus, .filtros select:focus{ border-color: var(--accent); }

  table{ width:100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
  thead th{
    text-align:left; font-size: 11.5px; text-transform:uppercase; letter-spacing:.03em;
    color: var(--text-muted); font-weight:600; padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: #fafafa;
  }
  tbody td{ padding: 11px 12px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition: background .1s ease; }
  tbody tr:hover{ background: #fafafa; }
  .codigo{ font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .empty-row{ text-align:center; color: var(--text-muted); }
  .empty-row td{ text-align:center; color: var(--text-muted); padding: 32px 12px; cursor:default; }
  .empty-row:hover{ background: transparent; }

  .paginacao{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 14px; font-size: 12.5px; color: var(--text-muted);
  }
  .pg-btns{ display:flex; gap:4px; }
  .pg-btns button{
    width:auto; margin:0; padding: 5px 10px; font-size:12.5px; font-weight:500;
    background:#fff; color: var(--text-muted); border:1px solid var(--border);
  }
  .pg-btns button:hover:not(:disabled){ background: var(--bg); color: var(--text); }
  .pg-btns button.pg-active{ background: var(--accent); color:#fff; border-color: var(--accent); }
  .pg-btns button:disabled{ opacity:.4; }
  .pg-dots{ padding: 5px 4px; color:#a1a1aa; }

  .badge{
    display:inline-block; font-size: 11px; font-weight:600; padding: 3px 8px;
    border-radius: 999px; text-transform: uppercase; letter-spacing: .02em;
  }
  .badge-ativo{ background:#f0fdf4; color:#15803d; }
  .badge-vendido, .badge-alugado{ background:#eff6ff; color:#1d4ed8; }
  .badge-inativo, .badge-pausado{ background:#f4f4f5; color:#71717a; }

  /* ── DETALHE ── */
  .voltar{
    width:auto; margin:0 0 16px; background:transparent; color: var(--text-muted);
    border: 1px solid var(--border); padding: 6px 12px; font-size: 12.5px; font-weight:500;
  }
  .voltar:hover{ background:#fff; color: var(--text); }

  .detalhe-head{ margin-bottom: 22px; }
  .detalhe-head .codigo{ display:block; margin-bottom: 4px; }
  .detalhe-head h2{ font-size: 18px; margin: 0 0 6px; }
  .detalhe-meta{ font-size: 13px; color: var(--text-muted); }

  .grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items:start; }
  @media (max-width: 720px){ .grid-2{ grid-template-columns: 1fr; } }

  .box{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  .box h3{ font-size: 13.5px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; }
  .box h3 .add-btn{ width:auto; margin:0; padding: 5px 10px; font-size:12px; }

  .item{ padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .item:last-child{ border-bottom:none; }
  .item-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .item-title{ font-weight:600; }
  .item-sub{ color: var(--text-muted); font-size:12.5px; margin-top:2px; }
  .item-del{ width:auto; margin:0; background:transparent; border:none; color:#a1a1aa; padding:2px 6px; font-size:12px; }
  .item-del:hover{ color: var(--error); background:transparent; }
  .item a{ color: var(--accent); }
  .cat-tag{
    display:inline-block; font-size: 10.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; color: var(--text-muted); background:#f4f4f5; border-radius:4px;
    padding: 2px 6px; margin-right:6px;
  }
  .empty-box{ color:#a1a1aa; font-size:12.5px; text-align:center; padding: 12px 0; }

  /* ── FORM INLINE (add proprietário / documento) ── */
  .subform{ display:none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .subform.open{ display:block; }
  .subform .field{ margin-bottom: 10px; }
  .subform label{ font-size:11px; }
  .subform-row{ display:flex; gap:8px; }
  .subform-row .field{ flex:1; }
  .subform button{ margin-top:12px; }
  .subform .cancel-link{
    display:block; text-align:center; margin-top:8px; font-size:12px; color:var(--text-muted);
    cursor:pointer; background:none; border:none; width:auto; padding:0;
  }
  .subform .cancel-link:hover{ color:var(--text); background:none; }
  select.sf{
    width:100%; font-family: var(--font); font-size:14px; padding:9px 11px;
    border:1px solid var(--border); border-radius: var(--radius); background:#fff; color:var(--text);
  }
  input[type=file]{ font-size:13px; padding: 6px 0; border:none; }

  .msg-inline{ font-size:12px; margin-top:8px; display:none; }
  .msg-inline.err-inline{ color: var(--error); }
  .msg-inline.ok-inline{ color:#15803d; }
</style>
</head>
<body>

  <div class="wrap" id="login-view">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-name">MOB CRM</div>
    </div>
    <div class="card">
      <h1>Entrar</h1>
      <p class="sub">Acesso restrito à equipe MOB Imóveis.</p>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('senha').focus()">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
      </div>

      <div class="err" id="err">E-mail ou senha incorretos.</div>

      <button id="btn-login" onclick="fazerLogin()">Entrar</button>
    </div>
    <div class="foot">crm.imoveismob.com.br</div>
  </div>

  <div id="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-name">MOB CRM</div>
      </div>
      <div class="who">
        <span id="who-name"></span>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="content">

      <!-- ── PÁGINA: LISTA ── -->
      <div class="page active" id="page-lista">
        <div class="lista-head">
          <h2>Imóveis</h2>
          <span class="lista-count" id="lista-count"></span>
        </div>
        <div class="filtros">
          <input type="text" id="f-texto" placeholder="Buscar por código, nome ou local..." oninput="filtrar()">
          <select id="f-status" onchange="filtrar()">
            <option value="">Todos os status</option>
          </select>
          <select id="f-corretor" onchange="filtrar()">
            <option value="">Todos os corretores</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Status</th>
              <th>Corretor</th>
              <th>Local</th>
            </tr>
          </thead>
          <tbody id="lista-body">
            <tr class="empty-row"><td colspan="6">Carregando...</td></tr>
          </tbody>
        </table>
        <div id="paginacao" class="paginacao"></div>
      </div>

      <!-- ── PÁGINA: DETALHE (pasta do imóvel) ── -->
      <div class="page" id="page-detalhe">
        <button class="voltar" onclick="voltarLista()">← Voltar</button>

        <div class="detalhe-head">
          <span class="codigo" id="det-codigo"></span>
          <h2 id="det-nome"></h2>
          <div class="detalhe-meta" id="det-meta"></div>
        </div>

        <div class="grid-2">
          <!-- Proprietário(s) -->
          <div class="box">
            <h3>
              Proprietário(s)
              <button class="add-btn" onclick="toggleSubform('sf-prop')">+ Adicionar</button>
            </h3>
            <div id="lista-proprietarios"></div>
            <div class="empty-box" id="prop-empty" style="display:none">Nenhum proprietário cadastrado.</div>

            <div class="subform" id="sf-prop">
              <div class="field"><label>Nome *</label><input type="text" id="prop-nome"></div>
              <div class="subform-row">
                <div class="field"><label>CPF</label><input type="text" id="prop-cpf"></div>
                <div class="field"><label>Telefone</label><input type="text" id="prop-telefone"></div>
              </div>
              <div class="field"><label>E-mail</label><input type="email" id="prop-email"></div>
              <div class="field"><label>Endereço</label><input type="text" id="prop-endereco"></div>
              <div class="field"><label>Observações</label><input type="text" id="prop-obs"></div>
              <button onclick="salvarProprietario()">Salvar proprietário</button>
              <button class="cancel-link" onclick="toggleSubform('sf-prop')">Cancelar</button>
              <div class="msg-inline err-inline" id="prop-err"></div>
            </div>
          </div>

          <!-- Documentos -->
          <div class="box">
            <h3>
              Documentos
              <button class="add-btn" onclick="toggleSubform('sf-doc')">+ Adicionar</button>
            </h3>
            <div id="lista-documentos"></div>
            <div class="empty-box" id="doc-empty" style="display:none">Nenhum documento anexado.</div>

            <div class="subform" id="sf-doc">
              <div class="field">
                <label>Categoria *</label>
                <select class="sf" id="doc-categoria">
                  <option value="contrato">Contrato</option>
                  <option value="visita">Visita</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
              <div class="field"><label>Título *</label><input type="text" id="doc-titulo" placeholder="Ex: Contrato de exclusividade"></div>
              <div class="field"><label>Arquivo (opcional)</label><input type="file" id="doc-arquivo"></div>
              <div class="field"><label>Observações</label><input type="text" id="doc-obs" placeholder="Nota livre, ex: relato da visita"></div>
              <button id="btn-doc-salvar" onclick="salvarDocumento()">Salvar documento</button>
              <button class="cancel-link" onclick="toggleSubform('sf-doc')">Cancelar</button>
              <div class="msg-inline err-inline" id="doc-err"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
async function neonQuery(sql, params) {
  const res = await fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: sql, params: params || [] })
  });
  if(!res.ok) {
    const err = await res.text();
    throw new Error('Query error: ' + err);
  }
  const data = await res.json();
  return data.rows || [];
}

function getAdminLogado() {
  try {
    var raw = localStorage.getItem('mobcrm_admin');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function showApp(admin) {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  document.getElementById('who-name').textContent = admin.nome + ' · ' + admin.role;
  carregarLista();
}

async function fazerLogin() {
  var email = document.getElementById('email').value.trim();
  var senha = document.getElementById('senha').value;
  var errEl = document.getElementById('err');
  var btn = document.getElementById('btn-login');

  errEl.style.display = 'none';

  if(!email || !senha) {
    errEl.textContent = 'Preencha e-mail e senha.';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = 'Entrando...';
  btn.disabled = true;

  try {
    var rows = await neonQuery(
      'SELECT id, nome, email, role FROM admins WHERE email=$1 AND senha=$2 LIMIT 1',
      [email, senha]
    );
    btn.textContent = 'Entrar';
    btn.disabled = false;

    if(!rows || rows.length === 0) {
      errEl.textContent = 'E-mail ou senha incorretos.';
      errEl.style.display = 'block';
      return;
    }

    var admin = rows[0];
    localStorage.setItem('mobcrm_admin', JSON.stringify(admin));
    showApp(admin);
  } catch(e) {
    btn.textContent = 'Entrar';
    btn.disabled = false;
    errEl.textContent = 'Não foi possível conectar. Tente novamente.';
    errEl.style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('mobcrm_admin');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('email').value = '';
  document.getElementById('senha').value = '';
}

function showPage(nome) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-' + nome).classList.add('active');
}

// ── LISTA DE IMÓVEIS ──
var _imoveis = [];

async function carregarLista() {
  var tbody = document.getElementById('lista-body');
  try {
    var rows = await neonQuery(
      "SELECT i.id, i.codigo, i.nome, i.tipo, i.status, i.local, i.corretor, a.nome as corretor_nome " +
      "FROM imoveis i LEFT JOIN admins a ON i.corretor_id = a.id " +
      "ORDER BY i.created_at DESC"
    );
    // ids vêm como string do Postgres (bigint) — normaliza pra number
    _imoveis = (rows || []).map(function(im){
      im.id = Number(im.id);
      return im;
    });
    popularFiltros();
    renderLista();
  } catch(e) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Erro ao carregar: ' + escapeHtml(e.message) + '</td></tr>';
  }
}

function popularFiltros() {
  var statusSet = {}, corretorSet = {};
  _imoveis.forEach(function(im){
    if(im.status) statusSet[im.status] = true;
    var cn = im.corretor_nome || im.corretor;
    if(cn) corretorSet[cn] = true;
  });
  var selStatus = document.getElementById('f-status');
  var selCorretor = document.getElementById('f-corretor');
  Object.keys(statusSet).sort().forEach(function(s){
    var opt = document.createElement('option'); opt.value = s; opt.textContent = capitalize(s);
    selStatus.appendChild(opt);
  });
  Object.keys(corretorSet).sort().forEach(function(c){
    var opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    selCorretor.appendChild(opt);
  });
}

var PG_SIZE = 30;
var _paginaAtual = 0;

function filtrar() {
  _paginaAtual = 0;
  renderLista();
}

function renderLista() {
  var texto = document.getElementById('f-texto').value.trim().toLowerCase();
  var fStatus = document.getElementById('f-status').value;
  var fCorretor = document.getElementById('f-corretor').value;

  var filtrados = _imoveis.filter(function(im){
    var cn = im.corretor_nome || im.corretor || '';
    if(fStatus && im.status !== fStatus) return false;
    if(fCorretor && cn !== fCorretor) return false;
    if(texto) {
      var alvo = ((im.codigo||'') + ' ' + (im.nome||'') + ' ' + (im.local||'')).toLowerCase();
      if(alvo.indexOf(texto) === -1) return false;
    }
    return true;
  });

  document.getElementById('lista-count').textContent = filtrados.length + (filtrados.length === 1 ? ' imóvel' : ' imóveis');

  var totalPaginas = Math.max(1, Math.ceil(filtrados.length / PG_SIZE));
  if(_paginaAtual >= totalPaginas) _paginaAtual = totalPaginas - 1;
  if(_paginaAtual < 0) _paginaAtual = 0;

  var inicio = _paginaAtual * PG_SIZE;
  var pagina = filtrados.slice(inicio, inicio + PG_SIZE);

  var tbody = document.getElementById('lista-body');
  if(pagina.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Nenhum imóvel encontrado.</td></tr>';
    renderPaginacao(0, filtrados.length);
    return;
  }

  tbody.innerHTML = pagina.map(function(im){
    var statusClass = 'badge-' + (im.status || '').toLowerCase().replace(/[^a-z]/g,'');
    return '<tr onclick="abrirImovel(' + im.id + ')">' +
      '<td class="codigo">' + escapeHtml(im.codigo || '—') + '</td>' +
      '<td>' + escapeHtml(im.nome || '—') + '</td>' +
      '<td>' + escapeHtml(im.tipo || '—') + '</td>' +
      '<td>' + (im.status ? '<span class="badge ' + statusClass + '">' + escapeHtml(im.status) + '</span>' : '—') + '</td>' +
      '<td>' + escapeHtml(im.corretor_nome || im.corretor || '—') + '</td>' +
      '<td>' + escapeHtml(im.local || '—') + '</td>' +
      '</tr>';
  }).join('');

  renderPaginacao(totalPaginas, filtrados.length);
}

function renderPaginacao(totalPaginas, totalItens) {
  var wrap = document.getElementById('paginacao');
  if(totalPaginas <= 1) { wrap.innerHTML = ''; return; }

  var inicio = _paginaAtual * PG_SIZE + 1;
  var fim = Math.min((_paginaAtual + 1) * PG_SIZE, totalItens);

  var html = '<span class="pg-info">' + inicio + '–' + fim + ' de ' + totalItens + '</span><div class="pg-btns">';
  html += '<button ' + (_paginaAtual === 0 ? 'disabled' : '') + ' onclick="irPagina(' + (_paginaAtual - 1) + ')">‹</button>';

  for(var p = 0; p < totalPaginas; p++) {
    if(totalPaginas > 7) {
      var perto = Math.abs(p - _paginaAtual) <= 1;
      var borda = p === 0 || p === totalPaginas - 1;
      if(!perto && !borda) {
        if(p === 1 || p === totalPaginas - 2) html += '<span class="pg-dots">…</span>';
        continue;
      }
    }
    html += '<button class="' + (p === _paginaAtual ? 'pg-active' : '') + '" onclick="irPagina(' + p + ')">' + (p+1) + '</button>';
  }

  html += '<button ' + (_paginaAtual === totalPaginas - 1 ? 'disabled' : '') + ' onclick="irPagina(' + (_paginaAtual + 1) + ')">›</button>';
  html += '</div>';
  wrap.innerHTML = html;
}

function irPagina(p) {
  _paginaAtual = p;
  renderLista();
  document.getElementById('page-lista').scrollIntoView({ behavior: 'instant', block: 'start' });
}

function voltarLista() {
  showPage('lista');
}

// ── DETALHE / PASTA DO IMÓVEL ──
var _imovelAtual = null;

async function abrirImovel(id) {
  var im = _imoveis.find(function(i){ return i.id === id; });
  if(!im) return;
  _imovelAtual = im;

  document.getElementById('det-codigo').textContent = im.codigo || '';
  document.getElementById('det-nome').textContent = im.nome || '(sem nome)';
  document.getElementById('det-meta').textContent =
    [im.tipo, im.status, im.local, (im.corretor_nome || im.corretor)].filter(Boolean).join(' · ');

  document.getElementById('sf-prop').classList.remove('open');
  document.getElementById('sf-doc').classList.remove('open');
  limparFormProprietario();
  limparFormDocumento();

  showPage('detalhe');
  await Promise.all([carregarProprietarios(id), carregarDocumentos(id)]);
}

function toggleSubform(id) {
  document.getElementById(id).classList.toggle('open');
}

// -- proprietários --
async function carregarProprietarios(imovelId) {
  var wrap = document.getElementById('lista-proprietarios');
  var empty = document.getElementById('prop-empty');
  try {
    var rows = await neonQuery('SELECT * FROM imovel_proprietarios WHERE imovel_id=$1 ORDER BY created_at ASC', [imovelId]);
    if(!rows || rows.length === 0) {
      wrap.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    wrap.innerHTML = rows.map(function(p){
      var linhas = [p.telefone, p.email, p.cpf].filter(Boolean).join(' · ');
      return '<div class="item">' +
        '<div class="item-top">' +
          '<span class="item-title">' + escapeHtml(p.nome) + '</span>' +
          '<button class="item-del" onclick="excluirProprietario(' + p.id + ',' + imovelId + ')">remover</button>' +
        '</div>' +
        (linhas ? '<div class="item-sub">' + escapeHtml(linhas) + '</div>' : '') +
        (p.endereco ? '<div class="item-sub">' + escapeHtml(p.endereco) + '</div>' : '') +
        (p.observacoes ? '<div class="item-sub">' + escapeHtml(p.observacoes) + '</div>' : '') +
      '</div>';
    }).join('');
  } catch(e) {
    wrap.innerHTML = '<div class="empty-box">Erro ao carregar: ' + escapeHtml(e.message) + '</div>';
  }
}

function limparFormProprietario() {
  ['prop-nome','prop-cpf','prop-telefone','prop-email','prop-endereco','prop-obs'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('prop-err').style.display = 'none';
}

async function salvarProprietario() {
  var nome = document.getElementById('prop-nome').value.trim();
  var errEl = document.getElementById('prop-err');
  errEl.style.display = 'none';
  if(!nome) {
    errEl.textContent = 'Nome é obrigatório.';
    errEl.style.display = 'block';
    return;
  }
  var cpf = document.getElementById('prop-cpf').value.trim();
  var telefone = document.getElementById('prop-telefone').value.trim();
  var email = document.getElementById('prop-email').value.trim();
  var endereco = document.getElementById('prop-endereco').value.trim();
  var obs = document.getElementById('prop-obs').value.trim();

  try {
    await neonQuery(
      'INSERT INTO imovel_proprietarios (imovel_id, nome, cpf, telefone, email, endereco, observacoes) VALUES ($1,$2,$3,$4,$5,$6,$7)',
      [_imovelAtual.id, nome, cpf || null, telefone || null, email || null, endereco || null, obs || null]
    );
    limparFormProprietario();
    document.getElementById('sf-prop').classList.remove('open');
    await carregarProprietarios(_imovelAtual.id);
  } catch(e) {
    errEl.textContent = 'Erro ao salvar: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function excluirProprietario(id, imovelId) {
  if(!confirm('Remover este proprietário?')) return;
  try {
    await neonQuery('DELETE FROM imovel_proprietarios WHERE id=$1', [id]);
    await carregarProprietarios(imovelId);
  } catch(e) {
    alert('Erro ao remover: ' + e.message);
  }
}

// -- documentos --
var CATEGORIA_LABEL = { contrato: 'Contrato', visita: 'Visita', outro: 'Outro' };

async function carregarDocumentos(imovelId) {
  var wrap = document.getElementById('lista-documentos');
  var empty = document.getElementById('doc-empty');
  try {
    var rows = await neonQuery(
      'SELECT d.*, a.nome as criado_por_nome FROM imovel_documentos d ' +
      'LEFT JOIN admins a ON d.criado_por = a.id WHERE d.imovel_id=$1 ORDER BY d.created_at DESC',
      [imovelId]
    );
    if(!rows || rows.length === 0) {
      wrap.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    wrap.innerHTML = rows.map(function(d){
      var data = d.created_at ? new Date(d.created_at).toLocaleDateString('pt-BR') : '';
      var autor = d.criado_por_nome ? ' · ' + d.criado_por_nome : '';
      return '<div class="item">' +
        '<div class="item-top">' +
          '<span><span class="cat-tag">' + escapeHtml(CATEGORIA_LABEL[d.categoria] || d.categoria) + '</span>' +
          '<span class="item-title">' + escapeHtml(d.titulo) + '</span></span>' +
          '<button class="item-del" onclick="excluirDocumento(' + d.id + ',' + imovelId + ')">remover</button>' +
        '</div>' +
        (d.arquivo_url ? '<div class="item-sub"><a href="' + escapeHtml(d.arquivo_url) + '" target="_blank" rel="noopener">Ver arquivo</a></div>' : '') +
        (d.observacoes ? '<div class="item-sub">' + escapeHtml(d.observacoes) + '</div>' : '') +
        '<div class="item-sub">' + escapeHtml(data + autor) + '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    wrap.innerHTML = '<div class="empty-box">Erro ao carregar: ' + escapeHtml(e.message) + '</div>';
  }
}

function limparFormDocumento() {
  document.getElementById('doc-categoria').value = 'contrato';
  document.getElementById('doc-titulo').value = '';
  document.getElementById('doc-arquivo').value = '';
  document.getElementById('doc-obs').value = '';
  document.getElementById('doc-err').style.display = 'none';
}

async function uploadParaR2(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = async function(e) {
      var base64 = e.target.result.split(',')[1];
      var ext = file.name.split('.').pop();
      var nome = 'crm_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
      try {
        var res = await fetch('/api/r2upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: nome, contentType: file.type, data: base64 })
        });
        if(!res.ok) throw new Error('Upload falhou: ' + res.status);
        var data = await res.json();
        resolve(data.url);
      } catch(err) { reject(err); }
    };
    reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
    reader.readAsDataURL(file);
  });
}

async function salvarDocumento() {
  var categoria = document.getElementById('doc-categoria').value;
  var titulo = document.getElementById('doc-titulo').value.trim();
  var obs = document.getElementById('doc-obs').value.trim();
  var arquivoInput = document.getElementById('doc-arquivo');
  var arquivo = arquivoInput.files[0];
  var errEl = document.getElementById('doc-err');
  var btn = document.getElementById('btn-doc-salvar');
  errEl.style.display = 'none';

  if(!titulo) {
    errEl.textContent = 'Título é obrigatório.';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = 'Salvando...';
  btn.disabled = true;

  try {
    var arquivoUrl = null;
    if(arquivo) {
      arquivoUrl = await uploadParaR2(arquivo);
    }
    var admin = getAdminLogado();
    await neonQuery(
      'INSERT INTO imovel_documentos (imovel_id, categoria, titulo, arquivo_url, observacoes, criado_por) VALUES ($1,$2,$3,$4,$5,$6)',
      [_imovelAtual.id, categoria, titulo, arquivoUrl, obs || null, admin ? admin.id : null]
    );
    btn.textContent = 'Salvar documento';
    btn.disabled = false;
    limparFormDocumento();
    document.getElementById('sf-doc').classList.remove('open');
    await carregarDocumentos(_imovelAtual.id);
  } catch(e) {
    btn.textContent = 'Salvar documento';
    btn.disabled = false;
    errEl.textContent = 'Erro ao salvar: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function excluirDocumento(id, imovelId) {
  if(!confirm('Remover este documento?')) return;
  try {
    await neonQuery('DELETE FROM imovel_documentos WHERE id=$1', [id]);
    await carregarDocumentos(imovelId);
  } catch(e) {
    alert('Erro ao remover: ' + e.message);
  }
}

// ── HELPERS ──
function escapeHtml(str) {
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

(function init(){
  var admin = getAdminLogado();
  if(admin) showApp(admin);
})();
